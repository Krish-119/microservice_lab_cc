networks:
  ai-ops-net:
    driver: bridge
    name: ai-ops-net

volumes:
  postgres-data:
    name: ai-ops-postgres-data

services:

  # ─────────────────────────────────────────────
  # PostgreSQL – single container, three databases
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    networks:
      - ai-ops-net
    command: >
      postgres
      -c max_connections=150
      -c shared_buffers=256MB
      -c log_statement=none
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────
  # cost-service  (port 8003 → 8000 inside)
  # ─────────────────────────────────────────────
  cost-service:
    image: lab/cost-service:1.0
    build:
      context: ./cost-service
      dockerfile: Dockerfile
    container_name: cost-service
    restart: unless-stopped
    networks:
      - ai-ops-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${COST_DB_USER}:${COST_DB_PASSWORD}@postgres-db:5432/costdb
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────
  # usage-service  (port 8002 → 8000 inside)
  # ─────────────────────────────────────────────
  usage-service:
    image: lab/usage-service:1.0
    build:
      context: ./usage-service
      dockerfile: Dockerfile
    container_name: usage-service
    restart: unless-stopped
    networks:
      - ai-ops-net
    depends_on:
      postgres:
        condition: service_healthy
      cost-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${USAGE_DB_USER}:${USAGE_DB_PASSWORD}@postgres-db:5432/usagedb
      COST_SERVICE_URL: ${COST_SERVICE_URL:-http://cost-service:8000}
      MODEL_MODE: ${MODEL_MODE:-mock}
      MOCK_LATENCY_SCALE: ${MOCK_LATENCY_SCALE:-1.0}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────
  # agent-service  (port 8001 → 8000 inside)
  # ─────────────────────────────────────────────
  agent-service:
    image: lab/agent-service:1.0
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: agent-service
    restart: unless-stopped
    networks:
      - ai-ops-net
    depends_on:
      postgres:
        condition: service_healthy
      usage-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${AGENT_DB_USER}:${AGENT_DB_PASSWORD}@postgres-db:5432/agentdb
      USAGE_SERVICE_URL: ${USAGE_SERVICE_URL:-http://usage-service:8000}
      COST_SERVICE_URL: ${COST_SERVICE_URL:-http://cost-service:8000}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
